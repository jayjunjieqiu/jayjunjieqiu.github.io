<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="d-flex align-items-baseline flex-wrap">
                    <h6 class="mb-0">GitHub Contributions</h6>
                    <a class="ml-auto small" target="_blank" rel="noopener" href="https://github.com/{{ site.data.profile.github }}">
                        View GitHub profile <i class="fas fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
                <div class="github-contributions-chart mt-3">
                    <img
                        src="https://ghchart.rshah.org/{{ site.data.profile.github }}"
                        alt="GitHub contribution calendar for {{ site.data.profile.github }}"
                        loading="lazy"
                        decoding="async">
                </div>
                <p class="small text-muted mb-0 mt-2">
                    Contribution activity is provided by GitHub and may be cached for up to a day.
                </p>
            </div>
        </div>
    </div>
</div>
