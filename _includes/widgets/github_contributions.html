<div class="row mt-3 justify-content-center">
    <div class="col-12 col-lg-10 col-xl-9">
        <details class="github-contributions card border-0 shadow-sm bg-white">
            <summary class="github-contributions-summary p-4">
                <span>
                    <span class="d-block h6 mb-1">GitHub Activity</span>
                    <span class="d-block small text-muted">Contribution calendar · last 12 months</span>
                </span>
                <span class="github-contributions-toggle" aria-hidden="true"></span>
            </summary>
            <div class="github-contributions-panel px-4 pb-4">
                <div class="github-contributions-chart">
                    <img
                        src="{{ '/assets/images/github-contributions.svg' | relative_url }}"
                        alt="GitHub contribution calendar for {{ site.data.profile.github }}"
                        loading="lazy"
                        decoding="async">
                </div>
                <p class="small text-muted mb-0 mt-3">Updated daily from GitHub; the cached chart avoids a remote request on every page load.</p>
            </div>
        </details>
    </div>
</div>
