projects:
  - title: Agentic Video Generation · Cross-Shot Consistency
    date: "Jul. – Sep. 2026"
    affiliation: ByFusion · LuckyShort
    description: Built a reference-conditioned video workflow that checks character and scene continuity across shots, regenerating inconsistent outputs while retaining accepted frames.
    details: >-
      Shared reference assets and multimodal checks help identify character and scene drift.
      Feedback is routed to regenerate the affected keyframes or shots. Creative direction
      is managed across generation stages and refined using final-video feedback,
      with model priors used to warm-start candidate search.
