intro: >-
  I’m a first-year Ph.D. student at HKUST (Guangzhou), advised by
  <a href="https://yuxuanliang.com/">Prof. Yuxuan Liang</a>.
  I study <strong>temporal modeling for physical AI</strong>.
perspective: >-
  My goal is to develop long-horizon memory for agents in dynamic environments,
  including embodied systems. My work spans temporal pretraining, multimodal
  video generation, and application-level memory for long-form storytelling.
cv: "/assets/files/resume.pdf"

research_interests: >-
  I’m interested in what an agent should retain from past observations,
  how that information should be updated as the environment changes,
  and how it can help with later predictions and decisions.

