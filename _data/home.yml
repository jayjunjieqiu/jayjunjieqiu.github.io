intro: >-
  I’m a first-year Ph.D. student at HKUST (Guangzhou), advised by
  <a href="https://yuxuanliang.com/">Prof. Yuxuan Liang</a>.
  I study <strong>information for intelligent action</strong>.
perspective: >-
  I study how intelligent systems learn, retain, and use information from
  observations and experience to understand changing environments and guide
  action. My work draws on sequence modeling, memory, and multimodal learning.
cv: "/assets/files/resume.pdf"

research_interests: >-
  Learning what matters for intelligent action.

