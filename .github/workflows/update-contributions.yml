name: Update GitHub contribution calendar

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Refresh the cached contribution chart
        run: >-
          curl --fail --location --silent --show-error --retry 3
          https://ghchart.rshah.org/jayjunjieqiu
          --output assets/images/github-contributions.svg

      - name: Commit the chart when it changed
        run: |
          if git diff --quiet -- assets/images/github-contributions.svg; then
            echo "Contribution chart is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/github-contributions.svg
          git commit -m "chore: update GitHub contribution calendar"
          git push
